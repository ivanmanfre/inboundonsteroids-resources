/* ---- display type: Archivo Black on every heading ----
   NOTE: every selector below is prefixed with ".lmc-root " to add
   one extra class of specificity. shared.css declares several

  letter-spacing: -0.01em !important;
  color: #111111 !important;
}

/* ---- red marker-swipe on the <em> flourish inside headings
