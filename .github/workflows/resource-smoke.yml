# R1B (2026-07-22): report-only post-deploy smoke test for resource pages.
# Runs AFTER the Pages deploy succeeds; never blocks or fails a deploy.
# On failures it commits .ci/smoke-report.md ([skip ci] so it never retriggers Pages).
name: Resource Smoke (report-only)

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: resource-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Smoke-test changed resource dirs (report-only)
        run: node scripts/resource-smoke.mjs || true
      - name: Commit failure report if any
        run: |
          if [ -f .ci/smoke-report.md ]; then
            git config user.name "resource-smoke-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .ci/smoke-report.md
            git diff --cached --quiet || { git commit -m "ci: resource smoke report [skip ci]"; git push; }
          fi
