<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connect your LinkedIn · RISE DTC</title>
<style>
  :root{--paper:#FFFFFF;--ink:#131210;--red:#C8361B;--muted:#6B675E;--gold:#ffc71d;--hair:#C9C2B2;--band:#F6F4EF}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:"Schibsted Grotesk",Arial,"Helvetica Neue",sans-serif;line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{max-width:520px;width:100%;padding:0 28px;text-align:left}
  .brandline{display:flex;align-items:center;gap:12px;margin-bottom:30px}
  .brandline .rule{height:6px;flex:1;background:var(--gold)}
  .wordmark{font-weight:800;letter-spacing:.02em;font-size:13px;text-transform:uppercase}
  .wordmark .on{color:var(--red);font-weight:800}
  h1{font-weight:800;letter-spacing:-0.02em;line-height:1.08;font-size:clamp(26px,5vw,34px);margin:4px 0 10px}
  p{margin:10px 0;color:var(--muted)}
  .spin{width:16px;height:16px;border:3px solid var(--band);border-top-color:var(--ink);border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:9px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  a.btn{display:inline-block;border:2px solid var(--ink);padding:9px 16px;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink);margin-top:6px}
  a.btn span{color:var(--red)}
  .err{color:var(--red);font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="brandline">
      <span class="wordmark">RISE DTC</span>
      <span class="rule"></span>
      <span class="wordmark">RUN BY INBOUND<span class="on">ON</span>STEROIDS</span>
    </div>
    <h1>Connect your LinkedIn</h1>
    <p id="status"><span class="spin"></span>Getting your secure LinkedIn link ready...</p>
    <div id="manual" style="display:none">
      <p>Your link is ready. If it did not open on its own:</p>
      <a class="btn" id="go" href="#" target="_blank" rel="noreferrer"><span>&#9632;</span> Open LinkedIn connect</a>
    </div>
    <div id="fail" style="display:none">
      <p class="err">Could not generate the link just now.</p>
      <p>Refresh this page, or tell Ivan in the channel and he'll drop a fresh one in.</p>
    </div>
  </div>
<script>
(function(){
  // Light gate: same token pattern as the onboarding pages.
  if (location.search.indexOf('k=rdtc-2026-onb') === -1) {
    document.body.innerHTML = '<div class="card"><p style="font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#131210">This page is private.</p><p>Use the full link you were given in your channel.</p></div>';
    return;
  }
  var MINT = 'https://n8n.ivanmanfredi.com/webhook/unipile-connect-link?k=455385254bc432d723be275a';
  var status = document.getElementById('status');
  var manual = document.getElementById('manual');
  var fail = document.getElementById('fail');
  fetch(MINT, { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var url = d && (d.url || (d.object && d.object.url));
      if (!url) throw new Error('no url');
      document.getElementById('go').href = url;
      status.style.display = 'none';
      manual.style.display = 'block';
      // Forward automatically; the manual button is the fallback.
      location.href = url;
    })
    .catch(function(){
      status.style.display = 'none';
      fail.style.display = 'block';
    });
})();
</script>
</body>
</html>
